# Ambiente di test di TrovaCampo, su server2 (Contabo), accanto al runner e a
# fototimeline. Stack a se': Mongo suo, nessun dato di produzione, nessuna
# rete condivisa con presenze.
#
#     docker compose -p trovacampo-test -f docker-compose.test.yml --env-file ~/trovacampo-test/.env.test up -d --build
#
# Lo costruisce e lo accende il workflow .github/workflows/test.yml (push sul
# branch "test"), sulla stessa macchina: niente registro, niente SSH.
#
# L'unica porta e' 127.0.0.1:8088: dal PC si apre con
#     ssh -N -L 8088:127.0.0.1:8088 server2
# e poi http://localhost:8088. Cosi' non serve DNS ne' Caddy, ne' si espone
# un sito di prova su Internet.

services:
  trovacampo-test-mongo:
    image: mongo:7
    container_name: trovacampo-test-mongo
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - mongo-dati:/data/db
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  trovacampo-test-backend:
    image: trovacampo-test-backend:${TAG_IMMAGINI:-locale}
    build:
      context: ./backend-java
    container_name: trovacampo-test-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@trovacampo-test-mongo:27017/trovacampo?authSource=admin
      PORT: "3000"
      # Il login e' quello di produzione, letto per l'indirizzo pubblico: il
      # test non ha un Keycloak suo e presenze non e' su questa macchina.
      KEYCLOAK_ISSUER: https://presenze.footballer.it/auth/realms/presenze
      KEYCLOAK_JWKS_URI: https://presenze.footballer.it/auth/realms/presenze/protocol/openid-connect/certs
      ANAGRAFICA_URL: https://presenze.footballer.it
      # Il test non manda notifiche a nessuno.
      NOTIFICHE_ATTIVE: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 448m
    depends_on:
      trovacampo-test-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  trovacampo-test-frontend:
    image: trovacampo-test-frontend:${TAG_IMMAGINI:-locale}
    build:
      context: ./mobile-ionic
      args:
        CONFIGURATION: test
    container_name: trovacampo-test-frontend
    restart: unless-stopped
    volumes:
      - ./mobile-ionic/nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8088:80"
    mem_limit: 64m
    depends_on:
      - trovacampo-test-backend

volumes:
  mongo-dati:
