name: Controlli

# I test su ogni pull request verso master.
#
# Qui girano da soli, senza l'etichetta "test" che presenze chiede: li' la
# suite del backend dura una mezz'ora e teneva occupati i runner, qui i due
# giri insieme stanno sotto il minuto. Una regola che non serve e' una regola
# che qualcuno dimentica di seguire, e una pull request senza test e' verde
# per finta.
#
# Niente Docker: i test del backend non usano Testcontainers (TrovaCampo
# parla con Mongo, e i suoi test non accendono container), quindi questo
# workflow gira anche su una macchina che il daemon non ce l'ha.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  backend:
    name: Test backend
    # Etichetta propria e non "presenze-build": un runner self-hosted di un
    # account personale e' registrato su un solo repository, quindi per
    # TrovaCampo ne serve uno suo (vedi produzione.yml).
    runs-on: [self-hosted, trovacampo-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # "./mvnw" e non "mvn": setup-java porta il JDK ma non Maven, e la
      # versione la decide il wrapper versionato nel repository.
      - name: Esegue i test
        working-directory: backend-java
        run: ./mvnw -B -ntp test

  frontend:
    name: Test e build frontend
    runs-on: [self-hosted, trovacampo-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-ionic/package-lock.json

      # Karma ha bisogno di un Chrome vero, e sulla macchina puo' stare in
      # posti diversi a seconda di come ci e' arrivato. Si cerca invece di
      # darlo per scontato: con "CHROME_BIN" sbagliato Karma non dice che
      # manca il browser, dice "No binary for ChromeHeadless browser on your
      # platform", che manda a cercare nel posto sbagliato.
      #
      # Se non c'e', il job si ferma qui dicendo cosa installare. Scaricarlo
      # da se' si e' provato e non basta: un browser scaricato senza le
      # librerie di sistema non parte -- su server2-trovacampo moriva con
      # "libatk-1.0.so.0: cannot open shared object file" dopo centoquattro
      # megabyte di scarico -- e quelle librerie vogliono sudo, che un job
      # non ha e non deve avere. Meglio un job rosso con l'istruzione giusta
      # che cento megabyte buttati a ogni giro per fallire lo stesso.
      #
      # Prima Chrome dal pacchetto .deb, poi Chromium. Su Ubuntu
      # "apt install chromium" mette lo snap (anche /usr/bin/chromium-browser
      # e' solo il suo lanciatore), e lo snap non parte da un processo del
      # servizio systemd del runner: "... .service is not a snap cgroup for
      # tag snap.chromium.chromium", e Karma rinuncia. E' successo su
      # server2-trovacampo il 21 ottobre 2026, con il job verde il 16.
      - name: Trova il browser per i test
        run: |
          for candidato in \
            "$CHROME_BIN" \
            /usr/bin/google-chrome-stable \
            /usr/bin/google-chrome \
            /usr/bin/chromium \
            /usr/bin/chromium-browser \
            /snap/bin/chromium
          do
            if [ -n "$candidato" ] && [ -x "$candidato" ]; then
              echo "CHROME_BIN=$candidato" >> "$GITHUB_ENV"
              echo "Browser: $candidato"
              exit 0
            fi
          done
          echo "::error::Nessun Chrome sul runner: i test del frontend girano su Chrome headless." >&2
          echo "Installalo una volta sola, sulla macchina del runner:" >&2
          echo "  wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" >&2
          echo "  sudo apt-get install -y ./google-chrome-stable_current_amd64.deb" >&2
          echo "Il pacchetto porta con se' le librerie che servono; lo snap di chromium dal servizio del runner non parte." >&2
          exit 1

      # "npm ci" e non "npm install": installa esattamente il lockfile, che e'
      # quello che gira in locale e nell'immagine di produzione.
      - name: Installa le dipendenze
        working-directory: mobile-ionic
        run: npm ci

      - name: Esegue i test
        working-directory: mobile-ionic
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      # La build di produzione e' un controllo a se': un template che non
      # compila passa i test -- che montano i componenti uno per uno -- e si
      # rompe solo qui, cioe' al rilascio se nessuno la prova prima.
      - name: Costruisce per la produzione
        working-directory: mobile-ionic
        run: npm run build -- --configuration production
