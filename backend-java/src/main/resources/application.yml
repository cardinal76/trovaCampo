spring:
  application:
    name: trovacampo-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/trovacampo}
  servlet:
    # I file Excel dell'importazione: qualche migliaio di righe sta sotto
    # il mega, 20 lascia margine a fogli con formattazione pesante.
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    # I campi facoltativi (anagrafica, campionati, coordinate) restano fuori
    # dal JSON quando mancano, come nell'API Node.
    default-property-inclusion: non_null

server:
  port: ${PORT:3000}

trovacampo:
  cors:
    origini: "*"
  nominatim:
    url: https://nominatim.openstreetmap.org
    user-agent: "TrovaCampo/0.1 (progetto di analisi calcio dilettantistico)"
  seed:
    abilitato: true
  importazione:
    # Vuoto = endpoint /api/admin/importazione spento (risponde 404).
    token: ${TROVACAMPO_IMPORTAZIONE_TOKEN:}
  geocodifica:
    # Dà le coordinate, una al secondo, alle societa' che non le hanno.
    automatica: true

# Solo /actuator/health, che e' quello che guarda l'healthcheck del container
# in produzione. Comprende il controllo su MongoDB: un backend acceso ma senza
# database risulta DOWN, invece di rispondere 500 a ogni ricerca.
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    it.trovacampo: INFO
