spring:
  application:
    name: trovacampo-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/trovacampo}
  servlet:
    # I file Excel dell'importazione: qualche migliaio di righe sta sotto
    # il mega, 20 lascia margine a fogli con formattazione pesante.
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    # I campi facoltativi (anagrafica, campionati, coordinate) restano fuori
    # dal JSON quando mancano, come nell'API Node.
    default-property-inclusion: non_null

server:
  port: ${PORT:3000}

trovacampo:
  cors:
    origini: "*"
  nominatim:
    url: https://nominatim.openstreetmap.org
    user-agent: "TrovaCampo/0.1 (progetto di analisi calcio dilettantistico)"
  seed:
    abilitato: true
  # Il Keycloak di presenze, che protegge solo /api/admin/** (importazione).
  # I valori di default sono quelli dello stack di sviluppo di presenze, dove
  # Keycloak sta sulla 8081 senza /auth.
  keycloak:
    # L'indirizzo scritto nei token, cioe' quello pubblico.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/presenze}
    # Da dove leggere le chiavi: in produzione la rete interna di Docker.
    jwks-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8081/realms/presenze/protocol/openid-connect/certs}
    client-id: trovacampo-frontend
  geocodifica:
    # Dà le coordinate, una al secondo, alle societa' che non le hanno.
    automatica: true
  # L'anagrafica di presenze (società, squadre, campionati e campi dai
  # Comunicati Ufficiali): in sviluppo il backend di presenze sulla 8080, in
  # produzione lo stesso dalla rete Docker condivisa.
  anagrafica:
    url: ${ANAGRAFICA_URL:http://localhost:8080}
    # Tre volte al giorno porta i campi nuovi in TrovaCampo. Spenta in
    # sviluppo; in produzione la accende docker-compose.prod.yml.
    sincronizzazione: ${ANAGRAFICA_SINCRONIZZAZIONE:false}

# Solo /actuator/health, che e' quello che guarda l'healthcheck del container
# in produzione. Comprende il controllo su MongoDB: un backend acceso ma senza
# database risulta DOWN, invece di rispondere 500 a ogni ricerca.
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    it.trovacampo: INFO
