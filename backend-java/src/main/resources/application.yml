spring:
  application:
    name: trovacampo-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/trovacampo}
  servlet:
    # I file Excel dell'importazione: qualche migliaio di righe sta sotto
    # il mega, 20 lascia margine a fogli con formattazione pesante.
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    # I campi facoltativi (anagrafica, campionati, coordinate) restano fuori
    # dal JSON quando mancano, come nell'API Node.
    default-property-inclusion: non_null

server:
  port: ${PORT:3000}

trovacampo:
  cors:
    origini: "*"
  nominatim:
    url: https://nominatim.openstreetmap.org
    user-agent: "TrovaCampo/0.1 (+https://trovacampo.footballer.it; progetto di analisi calcio dilettantistico)"
    # Fra due richieste a Nominatim, da qualsiasi parte del backend (usage
    # policy: al massimo una al secondo).
    intervallo: PT1.1S
  # Le fonti degli indirizzi delle societa' del Registro RASD (prospect): vedi
  # tools/prospect/INDIRIZZI_LAZIO.md per fonti e licenze.
  indirizzi:
    open-data:
      # Censimento impianti sportivi di Roma e Provincia, Citta' metropolitana
      # di Roma Capitale, CC0 1.0. Il catalogo CKAN scrive un IP interno nelle
      # URL delle risorse: questa e' la stessa risorsa sull'host pubblico.
      cmrc-url: https://opendata.cittametropolitanaroma.it/dataset/f1f8d5d1-3b6e-4111-8275-b95ab7ed8224/resource/98636f4f-77b1-427c-8047-010958cd3d17/download/impiantisportivi.csv
      # Impianti sportivi dei comuni del Veneto su dati.veneto.it, tutti CC BY
      # 4.0: non c'e' un censimento regionale. Il robots.txt del portale chiede
      # Crawl-delay: 10, quindi dieci secondi fra un file e l'altro (meno non si
      # puo'). I CSV vengono dal datastore CKAN del portale (/SpodCkanApi).
      veneto:
        intervallo: PT10S
        dataset:
          - comune: Verona
            titolo: "Comune di Verona - Impianti sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/40755968-33c6-48fb-bad6-a0a020c7124d.csv
          - comune: Schio
            titolo: "Comune di Schio - Impianti Sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/e82ce495-a09d-459e-92e1-9f74100ffbe8.csv
          - comune: Thiene
            titolo: "Comune di Thiene - Impianti Sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/b07ddfba-e1a0-43d1-a36e-b74665424c73.csv
          - comune: Valdagno
            titolo: "Comune di Valdagno - Impianti Sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/41685831-6a12-48b3-a940-5e4c685e3d96.csv
          - comune: Malo
            titolo: "Comune di Malo - Impianti sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/5894eeab-3ead-4d7d-95eb-a2289a1cf8f4.csv
          - comune: Monte di Malo
            titolo: "Comune di Monte di Malo - Impianti sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/496ca70b-ea34-4bf9-b9b4-8b54c3b76f15.csv
          - comune: Isola Vicentina
            titolo: "Comune di Isola Vicentina - Impianti Sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/0c17a1ee-3a6b-444e-b58e-cc6c5114eeb4.csv
          - comune: Villaverla
            titolo: "Comune di Villaverla - Impianti sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/8e342338-d0e8-423a-9a54-3f2ce8578d07.csv
          - comune: Santorso
            titolo: "Comune di Santorso - Impianti Sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/a8c8d878-7059-46c3-861f-182faca1b5c0.csv
          - comune: Zugliano
            titolo: "Comune di Zugliano - Impianti Sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/e216753c-5e8b-4e0e-83c1-87ba8f4b1422.csv
          - comune: San Vito di Leguzzano
            titolo: "Comune di San Vito di Leguzzano - Impianti Sportivi"
            url: https://dati.veneto.it/SpodCkanApi/api/3/datastore/dump/b863866c-357e-47a1-a448-d3c404043497.csv
  seed:
    abilitato: true
  # Il Keycloak di presenze, che protegge solo /api/admin/** (importazione).
  # I valori di default sono quelli dello stack di sviluppo di presenze, dove
  # Keycloak sta sulla 8081 senza /auth.
  keycloak:
    # L'indirizzo scritto nei token, cioe' quello pubblico.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/presenze}
    # Da dove leggere le chiavi: in produzione la rete interna di Docker.
    jwks-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8081/realms/presenze/protocol/openid-connect/certs}
    client-id: trovacampo-frontend
  geocodifica:
    # Dà le coordinate, una al secondo, alle societa' che non le hanno.
    automatica: true
  province:
    # All'avvio ricava dal comune la provincia dei campi che ne sono senza.
    completamento: true
  # L'anagrafica di presenze (società, squadre, campionati e campi dai
  # Comunicati Ufficiali): in sviluppo il backend di presenze sulla 8080, in
  # produzione lo stesso dalla rete Docker condivisa.
  anagrafica:
    url: ${ANAGRAFICA_URL:http://localhost:8080}

  # La lista delle ASD/SSD dal Registro nazionale (RASD) di Sport e Salute:
  # importazione lanciata a mano da /admin/prospect, vedi tools/prospect/README.md.
  prospect:
    rasd:
      url: ${RASD_URL:https://registro.sportesalute.eu}
      # Chi siamo, in ogni richiesta: niente finti browser.
      user-agent: "TrovaCampo-prospect/0.1 (+https://trovacampo.footballer.it)"
      # Il minimo fra due richieste qualunque al registro, nel client HTTP.
      # Almeno 1000: sotto il secondo il limitatore non scende comunque.
      intervallo-ms: 1100
      # Il ritmo dell'importazione: la priorita' e' non farsi bloccare, non
      # la velocita'. Vedi tools/prospect/README.md, "Ritmo e tempi".
      ritmo:
        # Pausa fra una richiesta e l'altra, piu' un jitter casuale fra 0 e
        # jitter-ms: di default fra 3 e 4 secondi. Sotto 1000 non si scende.
        pausa-ms: ${PROSPECT_RASD_PAUSA_MS:3000}
        jitter-ms: ${PROSPECT_RASD_JITTER_MS:1000}
        # Le ore in cui si lavora, ora italiana; fuori l'importazione si mette
        # in pausa da sola e riparte all'apertura. Vuota: a ogni ora.
        finestra: "${PROSPECT_RASD_FINESTRA:22:00-07:00}"
        fuso: Europe/Rome
        # Al massimo tante richieste per giorno di calendario (ora italiana);
        # raggiunto, si riprende a mezzanotte. 0: nessun tetto.
        tetto-giornaliero: ${PROSPECT_RASD_TETTO:7000}
      # Il dettaglio di una societa' letto da meno di tanti giorni non si richiede.
      dettaglio-valido-giorni: ${PROSPECT_RASD_DETTAGLIO_GIORNI:30}

  # Notifiche push (Web Push) per chi segue una squadra o vuole le partite
  # vicine. Le chiavi VAPID, se VAPID_PUBBLICA e VAPID_PRIVATA non ci sono,
  # il backend le crea da solo e le tiene in Mongo (vedi DepositoChiaviVapid).
  notifiche:
    # Il giro ogni cinque minuti che manda gli avvisi.
    attive: ${NOTIFICHE_ATTIVE:true}
    # Il "sub" della firma VAPID: chi avvisare se le notifiche danno noia.
    contatto: https://trovacampo.footballer.it
    vapid:
      pubblica: ${VAPID_PUBBLICA:}
      privata: ${VAPID_PRIVATA:}
    # Gli unici host a cui il backend manda notifiche (e sottodomini): gli
    # endpoint arrivano da chiunque, e non devono poter puntare altrove.
    # Una riga sola, separata da virgole: @Value non legge le liste YAML.
    servizi-push: fcm.googleapis.com,android.googleapis.com,push.services.mozilla.com,push.apple.com,notify.windows.com

# Solo /actuator/health, che e' quello che guarda l'healthcheck del container
# in produzione. Comprende il controllo su MongoDB: un backend acceso ma senza
# database risulta DOWN, invece di rispondere 500 a ogni ricerca.
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    it.trovacampo: INFO
