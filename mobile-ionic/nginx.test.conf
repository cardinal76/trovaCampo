# Ambiente di test: oltre all'app serve /api/* girandolo al backend, cosi'
# l'app sta su una sola origine (http://localhost:8088 col tunnel) e non
# serve un proxy davanti. Per il resto uguale a nginx.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://trovacampo-test-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
}
