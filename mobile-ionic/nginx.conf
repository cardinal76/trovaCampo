# Serve solo l'app. Le chiamate /api/* non passano di qui: le smista Caddy
# (nel Caddyfile di presenze) direttamente al backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le rotte dell'app esistono solo lato client: un ricaricamento su
    # /risultati deve restituire index.html, non 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bundle e media hanno l'hash nel nome (outputHashing "all"), quindi non
    # cambiano mai contenuto. Il favicon no, e resta fuori di proposito.
    location ~* (?:\.(?:js|css)$|^/media/) {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html invece si rilegge sempre, altrimenti dopo un rilascio il
    # browser continuerebbe a chiedere bundle che non esistono piu'.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
