<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Aggiungi campo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contenuto-largo">
    <ion-text color="medium">
      <p>Puoi usare il microfono della tastiera per dettare il testo in ogni campo.</p>
    </ion-text>

    <ion-list>
      <ion-item>
        <ion-input
          label="Nome campo"
          labelPlacement="stacked"
          placeholder="es. Campo Certosa"
          [ngModel]="nomeCampo()"
          (ngModelChange)="nomeCampo.set($event)"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Nome società"
          labelPlacement="stacked"
          placeholder="es. A.S.D. Certosa Calcio"
          [ngModel]="nomeSocieta()"
          (ngModelChange)="nomeSocieta.set($event)"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Indirizzo"
          labelPlacement="stacked"
          placeholder="es. Via della Certosa 12, Roma"
          enterkeyhint="done"
          [ngModel]="indirizzo()"
          (ngModelChange)="indirizzo.set($event)"
          (keyup.enter)="salva()"
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" [disabled]="!pronto() || salvataggio()" (click)="salva()">
      @if (salvataggio()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Salva
      }
    </ion-button>
  </div>
</ion-content>
